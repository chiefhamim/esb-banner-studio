<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"story":{"id":"a1","title":"বিদ্যুতের দাম নিয়ে গণশুনানি","body":"<p>বাংলাদেশ এনার্জি রেগুলেটরি কমিশন (বিইআরসি) আগামী মাসে বিদ্যুতের পাইকারি দাম নিয়ে গণশুনানির আয়োজন করতে যাচ্ছে। বিতরণ কোম্পানিগুলো ইতিমধ্যে সংশোধিত প্রস্তাব জমা দিয়েছে।</p><p>প্রস্তাবে প্রতি ইউনিটে গড়ে ১২ শতাংশ দাম বাড়ানোর কথা বলা হয়েছে, যা কার্যকর হলে শিল্প গ্রাহকদের ওপর প্রভাব পড়বে বলে মনে করছেন বিশ্লেষকরা। কমিশন জানিয়েছে, শুনানিতে ভোক্তা প্রতিনিধিরাও অংশ নিতে পারবেন।</p><p>বিদ্যুৎ বিভাগের এক কর্মকর্তা বলেন, ভর্তুকির চাপ কমাতে দাম সমন্বয় ছাড়া উপায় নেই। তবে গ্রাহকদের ওপর চাপ কমাতে ধাপে ধাপে বাড়ানোর কথা ভাবা হচ্ছে।</p>"},"nav":["প্রচ্ছদ","সর্বশেষ"]}},"page":"/story/[slug]"}</script>
